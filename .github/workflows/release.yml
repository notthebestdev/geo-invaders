name: Release

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        if: github.repository == 'notthebestdev/geo-invaders'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js 20.x
              uses: actions/setup-node@v6
              with:
                  node-version: 20.x
                  cache: npm

            - name: Install Dependencies
              run: npm ci --prefer-offline

            - name: Create Release Pull Request
              id: changesets
              uses: changesets/action@v1.5.3
              with:
                  commit: "ci(repo): version packages"
                  title: "ci(repo): version packages"
                  version: "npx changeset version"
                  publish: ""
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check if version was updated
              id: version_check
              run: |
                  # Check if the last commit message indicates a version update
                  LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
                  if [[ "$LAST_COMMIT_MSG" == *"ci(repo): version packages"* ]]; then
                      echo "version_updated=true" >> $GITHUB_OUTPUT
                  else
                      echo "version_updated=false" >> $GITHUB_OUTPUT
                  fi

            - name: Create GitHub Release
              if: steps.version_check.outputs.version_updated == 'true'
              run: .github/scripts/create-release.sh
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

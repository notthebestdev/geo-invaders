# This lint workflow is for PRs only!

name: "Lint"

permissions:
    contents: read

on:
    pull_request:
        branches: ["dev"]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint
            - name: Run tests
              run: npm run test
